<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>面板 · boostCodex</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <button class="brand" data-action="overview"><span class="brand-mark">B</span><span>面板<small>boostCodex</small></span></button>
      <button class="nav-item selected" id="overview-nav" data-action="overview">项目总览<span id="project-count">0</span></button>
      <div class="section-label">项目<button class="subtle" data-action="new-project" aria-label="添加项目">+</button></div>
      <nav id="project-nav" aria-label="项目列表"></nav>
      <div class="sidebar-bottom"><span class="connection" id="connection">正在连接</span><button class="subtle" data-action="refresh" aria-label="刷新">刷新</button></div>
    </aside>
    <main>
      <header class="topbar"><div id="breadcrumb">项目总览</div><label class="tool-choice">执行工具<select id="tool"><option value="codex">Codex</option><option value="claude">Claude Code</option></select></label></header>
      <div id="content" aria-live="polite"></div>
    </main>
  </div>
  <div id="toast" role="status" hidden></div>
  <dialog id="form-dialog"><form id="dialog-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="subtle" type="button" data-action="close-dialog" aria-label="关闭">×</button></div><div id="dialog-fields"></div><p class="error" id="dialog-error" role="alert"></p><div class="dialog-actions"><button type="button" data-action="close-dialog">取消</button><button class="primary" id="dialog-submit" type="submit">保存</button></div></form></dialog>
</body></html>
